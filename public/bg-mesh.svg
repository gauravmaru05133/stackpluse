<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="g1" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(320 220) rotate(90) scale(520 480)">
      <stop stop-color="#8B5CFF" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8B5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1580 260) rotate(90) scale(460 420)">
      <stop stop-color="#00F0FF" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 860) rotate(90) scale(580 420)">
      <stop stop-color="#FF8A6A" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FF8A6A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(960 500) rotate(90) scale(220 220)">
      <stop stop-color="#00F0FF" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#8B5CFF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#070B14" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#00F0FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8B5CFF" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="#070B14"/>
  <rect width="1920" height="1080" fill="url(#g1)"/>
  <rect width="1920" height="1080" fill="url(#g2)"/>
  <rect width="1920" height="1080" fill="url(#g3)"/>
  <rect width="1920" height="1080" fill="url(#core)"/>

  <!-- soft grid -->
  <g opacity="0.18" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 180 H1920 M0 360 H1920 M0 540 H1920 M0 720 H1920 M0 900 H1920"/>
    <path d="M240 0 V1080 M480 0 V1080 M720 0 V1080 M960 0 V1080 M1200 0 V1080 M1440 0 V1080 M1680 0 V1080"/>
  </g>

  <!-- network nodes / module orbit -->
  <g opacity="0.7">
    <circle cx="960" cy="500" r="8" fill="#00F0FF"/>
    <circle cx="960" cy="500" r="28" stroke="#00F0FF" stroke-opacity="0.35" fill="none"/>
    <circle cx="960" cy="500" r="78" stroke="#8B5CFF" stroke-opacity="0.25" fill="none"/>
    <circle cx="960" cy="500" r="150" stroke="#FFFFFF" stroke-opacity="0.08" fill="none" stroke-dasharray="4 10"/>

    <line x1="960" y1="500" x2="720" y2="340" stroke="url(#line)" stroke-width="1.5"/>
    <line x1="960" y1="500" x2="1220" y2="320" stroke="url(#line)" stroke-width="1.5"/>
    <line x1="960" y1="500" x2="1280" y2="560" stroke="url(#line)" stroke-width="1.5"/>
    <line x1="960" y1="500" x2="780" y2="680" stroke="url(#line)" stroke-width="1.5"/>
    <line x1="960" y1="500" x2="640" y2="520" stroke="url(#line)" stroke-width="1.5"/>

    <rect x="680" y="308" width="86" height="54" rx="10" fill="#0E1524" stroke="#00F0FF" stroke-opacity="0.45"/>
    <rect x="1180" y="288" width="86" height="54" rx="10" fill="#0E1524" stroke="#8B5CFF" stroke-opacity="0.5"/>
    <rect x="1240" y="532" width="86" height="54" rx="10" fill="#0E1524" stroke="#FF8A6A" stroke-opacity="0.45"/>
    <rect x="740" y="652" width="86" height="54" rx="10" fill="#0E1524" stroke="#00F0FF" stroke-opacity="0.35"/>
    <rect x="598" y="492" width="86" height="54" rx="10" fill="#0E1524" stroke="#8B5CFF" stroke-opacity="0.4"/>

    <circle cx="720" cy="340" r="4" fill="#00F0FF"/>
    <circle cx="1220" cy="320" r="4" fill="#8B5CFF"/>
    <circle cx="1280" cy="560" r="4" fill="#FF8A6A"/>
    <circle cx="780" cy="680" r="4" fill="#00F0FF"/>
    <circle cx="640" cy="520" r="4" fill="#8B5CFF"/>
  </g>

  <!-- floating particles -->
  <g fill="#00F0FF" opacity="0.45">
    <circle cx="240" cy="160" r="2"/>
    <circle cx="420" cy="780" r="1.5"/>
    <circle cx="1500" cy="180" r="2"/>
    <circle cx="1700" cy="700" r="1.5"/>
    <circle cx="300" cy="500" r="1.5"/>
    <circle cx="1100" cy="140" r="2"/>
  </g>
  <g fill="#8B5CFF" opacity="0.4">
    <circle cx="180" cy="620" r="2"/>
    <circle cx="1600" cy="480" r="2"/>
    <circle cx="900" cy="900" r="1.5"/>
    <circle cx="1320" cy="820" r="2"/>
  </g>
</svg>
